services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tv_time
      POSTGRES_USER: tv_time
      POSTGRES_PASSWORD: tv_time_dev
    ports:
      - "5432:5432"
    volumes:
      - tv_time_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tv_time -d tv_time"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tv_time_postgres:
